[project]
name = "text2sql-demo"
version = "0.1.0"
description = "Text-to-SQL demo on fake app metrics (local Qwen3-8B via Ollama) with an eval-driven improvement loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp<2",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "streamlit>=1.66.0",
]

[project.scripts]
text2sql-ask = "text2sql_demo.cli:main"
text2sql-mcp = "text2sql_demo.mcp_server:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
